server:
  port: 8081
  # Do not leak server details or stack traces to clients (insecure config defence).
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: auth-service
  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/authdb}
    username: ${AUTH_DB_USER:auth}
    password: ${AUTH_DB_PASSWORD:authpass}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

app:
  jwt:
    issuer: ${JWT_ISSUER:wallet-auth}
    access-token-ttl-seconds: ${ACCESS_TOKEN_TTL:900}      # 15 minutes
    refresh-token-ttl-seconds: ${REFRESH_TOKEN_TTL:604800} # 7 days

logging:
  level:
    com.example.wallet: INFO
