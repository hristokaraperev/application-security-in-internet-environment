<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сигурен портфейл — демо</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>🔐 Сигурен дигитален портфейл</h1>
    <p class="subtitle">Демонстрация на JWT автентикация и защитена комуникация между микросървиси</p>
</header>

<main>
    <!-- ============ LOGIN ============ -->
    <section id="auth-panel" class="card">
        <h2>Вход</h2>
        <label>Потребител <input id="username" value="alice" autocomplete="username"></label>
        <label>Парола <input id="password" type="password" value="Password123" autocomplete="current-password"></label>
        <div class="actions">
            <button id="btn-login">Вход</button>
            <button id="btn-register" class="secondary">Регистрация</button>
        </div>
        <p class="hint">Демо потребители: <code>alice</code> / <code>bob</code> — парола <code>Password123</code></p>
    </section>

    <!-- ============ WALLET ============ -->
    <section id="wallet-panel" class="card hidden">
        <div class="row">
            <h2>Портфейл на <span id="current-user"></span></h2>
            <button id="btn-logout" class="secondary">Изход</button>
        </div>

        <div class="balance">
            Баланс: <strong id="balance">—</strong>
            <button id="btn-balance" class="small">Обнови</button>
        </div>

        <h3>Превод</h3>
        <label>Към <input id="to-username" value="bob"></label>
        <label>Сума <input id="amount" type="number" step="0.01" value="100.00"></label>
        <button id="btn-transfer">Изпрати</button>

        <h3>Транзакции <button id="btn-transactions" class="small">Зареди</button></h3>
        <ul id="transactions"></ul>

        <div class="token-actions">
            <button id="btn-refresh" class="secondary">Поднови токен</button>
        </div>
    </section>

    <!-- ============ STATUS PANEL ============ -->
    <section id="status-panel" class="card">
        <h2>Статус панел</h2>
        <div class="status-line">Access токен: <code id="token-display">няма</code></div>
        <div class="status-line">Последен отговор: <span id="last-status" class="badge">—</span></div>
        <pre id="log"></pre>
    </section>
</main>

<script src="app.js"></script>
</body>
</html>
