server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: ${AUTH_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/auth/**
        - id: wallet-service
          uri: ${WALLET_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/**
      # Security headers added to every response (XSS / clickjacking / sniffing).
      default-filters:
        - AddResponseHeader=X-Content-Type-Options, nosniff
        - AddResponseHeader=X-Frame-Options, DENY
        - AddResponseHeader=Referrer-Policy, no-referrer
        - AddResponseHeader=Content-Security-Policy, default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'

app:
  gateway:
    shared-secret: ${GATEWAY_SHARED_SECRET:change-me-in-prod}
    rate-limit-requests: ${RATE_LIMIT_REQUESTS:60}
    rate-limit-window-seconds: ${RATE_LIMIT_WINDOW:10}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    com.example.wallet: INFO
